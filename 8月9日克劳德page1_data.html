曝光变化\n点击率变化\n转化率变化\n父亲节周期曝光趋势\n效果总结\n•\n修改后两日内搜索归因曝光和推荐归因曝光均提升；\n•\n搜索归因点击率明显上涨；\n•\n搜索归因转化率同步提升；\n•\n父亲节前6.11-6.20 平均曝光达到近两月最高水平。\n跨境电商商品标题优化案例复盘\n7 / 28\n"}, {"page": 8, "text": "案例2：节庆关键词优化\n修改前标题\nHoliday Gift Fashion Men’s Short Sleeve T-Shirt Holiday Attire 2026 Year of the Horse\nSt. Patrick’s Day Carnival Easter Trendy Versatile Men’s Wear Holiday Surprise Gift\n修改后标题\nIndependence Day T-Shirts, Retro USA Flag Crewneck Cotton Blend Tee, Great 250\nAmerican Celebration Items, Comfortable And Breathable\n跨境电商商品标题优化案例复盘\n8 / 28\n"}, {"page": 10, "text": "案例2：关键词收益分析\n关键词优化带来的流量变化\n• 修改后三天左右获得明显曝光增长；\n• 收益热搜词包含新增标题关键词；\n• 说明标题关键词与用户搜索需求形成有效匹配。\n新增关键词点击率收益\n关键词转化率反馈\n跨境电商商品标题优化案例复盘\n10 / 28\n"}, {"page": 12, "text": "案例3：风格关键词与适用范围优化\n修改前标题\nGirls Midriff-baring Short-sleeved and Wide-leg Pants Suit, Retro Racing Suit Element Print, Teen Girls,\n3-8Y Teen Girl Clothes, Summer Clothing, Popular with Girls, Fashionable Street, Cool Style, Daily\nCasual, Party Venue, Polyester Blend\n修改后标题\nGirls Midriff-baring Short-sleeved and baggy Pants Suit, Retro Racing Suit Element Print, from 3 to 16\nyears old, suitable for young girls, tween girls and Teen Girl, Summer and autumn Clothing, Popular,\nbaddie, Y2K Streetwear, Cool Style, Daily Casual, Party Venue, Polyester Blend\n跨境电商商品标题优化案例复盘\n12 / 28\n"}, {"page": 14, "text": "案例4：人群关键词优化\n修改前\nMen’s Casual Stand Collar Solid Color Shirt, PLUS SIZE\n修改后\nBig and Tall Men’s Casual Stand Collar Solid Color Shirt, PLUS SIZE\n修改重点\n增加Big and Tall 男性消费者搜索词，精准覆盖大码男装用户。\n跨境电商商品标题优化案例复盘\n14 / 28\n"}, {"page": 16, "text": "案例5：风格热搜词优化\n修改前\nW18-3 Men’s Short-Sleeved Shirt Cross-Border Print Shirt Men’s Casual Plus Size Slim-Fit Shirt\n修改后\nMen’s Short-Sleeved Shirt Cross-Border Print Shirt Men’s Casual Plus Size Slim-Fit Shirt Hawaiian\nShirt Men\n修改重点\n增加Hawaiian shirt men 风格关键词。\n跨境电商商品标题优化案例复盘\n16 / 28\n"}, {"page": 18, "text": "案例6：墨西哥站西语本地化优化\n修改前\nJuego de 3 camisetas de algodón lavado 100% puro algodón de 240g con cuello redondo y estilo\ndesgastado3 件装100% 纯棉水洗T 恤，240g 重磅面料，圆领设计，复古做旧风格。\n修改后\nPack de 3 Camisetas para Hombre 100% Algodón Lavado 240g, Cuello Redondo, Efecto Vintage\nDesgastado, Estilo Y2K, Streetwear Urbano, Casual para Trabajo, Salidas y Uso Diario3 件装男士100%\n纯棉水洗T 恤，240g 重磅面料，圆领设计，复古做旧效果，Y2K 风格，都市街头潮流穿搭，适合工作、\n外出及日常穿着的休闲款。\n跨境电商商品标题优化案例复盘\n18 / 28\n"}, {"page": 20, "text": "案例7：墨西哥男士衬衫风格词优化\n修改前标题\nD2428 Camisa Casual de Manga Corta con Estampado Digital para Hombres, Nueva Moda de Verano,\nComercio Exterior, Talla Grande, Estilo Aloha D2428 男士数码印花短袖休闲衬衫，夏季新款，对外贸易，\n大码设计，Aloha 风格娱乐主管\n修改后标题\nCamisa Casual De Manga Corta Con Estampado Digital Para Hombres, Nueva Moda De Verano,\nComercio Exterior, Talla Grande, Estilo Aloha, Top Elegante Y Cómodo, Tipo Guayabera Moderna Con\nToques Bohemios Y Estilo Old Money. Ideal Para El Verano, Looks Casuales, Fin De Semana, Viajes,\nPlaya Y Actividades Al Aire Libre. 男士数码印花短袖休闲衬衫，夏季新款，对外贸易，大码设计，Aloha\n风格，优雅舒适上衣，现代古巴衬衫版型，融合波西米亚风与老钱风格。适合夏季穿着、休闲造型、周末、\n旅行、海滩及户外活动。\n跨境电商商品标题优化案例复盘\n20 / 28\n"}, {"page": 22, "text": "案例7：优化效果\n标题优化价值\n1 从单一产品描述升级为消费场景描述；\n2 从夏威夷衬衫扩展至墨西哥特色服饰；\n3 覆盖更多搜索入口：\n• Guayabera\n• Old Money\n• Beach Style\n• Travel Outfit\n4 提升消费者对于产品用途和风格的理解。\n跨境电商商品标题优化案例复盘\n22 / 28\n"}, {"page": 24, "text": "案例8：流量变化分析\n优化策略\n• 原标题已经具备较完整产品信息；\n• 未进行大幅修改；\n• 增加消费者主动搜索的风格关键词。\n流量反馈\n• 修改标题后第一日曝光下降；\n• 随后曝光持续上涨；\n• 说明新增关键词逐步被搜索系统识别。\n跨境电商商品标题优化案例复盘\n24 / 28\n"}, {"page": 26, "text": "结论：标题优化的核心逻辑\n1 标题优化不是简单堆叠关键词，而是重新构建消费者搜索路径。\n2 通过：\n• 热搜关键词\n• 产品属性\n• 消费场景\n• 用户画像\n• 本地语言\n形成完整商品表达。\n3 最终目标：\n提升曝光→提升点击→提升精准流量→提升转化。\nData Driven + Consumer Search Insight\n跨境电商商品标题优化案例复盘\n26 / 28\n"}], "pdfImages": {"1": "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1RV19iZ2hnPk1xeXBkeFxlZ2P/2wBDARESEhgVGC8aGi9jQjhCY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2P/wAARCAHCAyADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMCAQf/xABHEAACAgIAAwMIBQoFAgYDAQAAAQIDBBEFEiETFTEGFiJBUVO function escRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function renderExcel(){
  var dim=window.currentDim||Object.keys(DATA.excel)[0];
  var q=document.getElementById('excelSearch').value.trim().toLowerCase();
  var items=DATA.excel[dim]||[];
  var html='<table><tr><td>维度</td><td>子类</td><td>中文</td><td>英文</td><td>关键词</td></tr>';
  var count=0;
  items.forEach(function(r){
    if(q&&!((r.cn||'').toLowerCase().includes(q)||(r.en||'').toLowerCase().includes(q)||(r.kw||'').toLowerCase().includes(q)||(r.sub||'').toLowerCase().includes(q)))return;
    html+='<tr><td>'+r.dim+'</td><td>'+(r.sub||'')+'</td><td>'+(r.cn||'')+'</td><td>'+(r.en||'')+'</td><td>'+(r.kw||'')+'</td></tr>';
    count++;
  });
  html+='</table>';
  document.getElementById('excelBody').innerHTML=html;
  document.getElementById('excelCount').textContent=count+'条';
}

function buildDimToolbar(){
  var html='';
  Object.keys(DATA.excel).forEach(function(dim,i){
    html+='<button class="dim-btn'+(i===0?' active':'')+'" onclick="selectDim(this,\''+dim+'\')">'+dim+'</button>';
  });
  document.getElementById('dimToolbar').innerHTML=html;
}

function selectDim(btn,dim){
  document.querySelectorAll('.dim-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  window.currentDim=dim;
  renderExcel();
}

function renderCatTree(){
  var q=document.getElementById('catSearch').value.trim().toLowerCase();
  var html='';
  var count=0;
  DATA.categories.forEach(function(c){
    var path=Array.isArray(c)?c.join(' › '):c;
    if(q&&!path.toLowerCase().includes(q))return;
    html+='<div class="cat-item"><div class="cat-path">'+path+'</div></div>';
    count++;
  });
  document.getElementById('catList').innerHTML=html;
  document.getElementById('catCount').textContent=count+'条';
}

function renderPDF(){
  var html='';
  DATA.pdf.forEach(function(p){
    var img=DATA.pdfImages[p.page]||'';
    var imgHtml=img?'<img src="data:image/jpeg;base64,'+img+'" onclick="openImg(this.src)">':'';
    html+='<div class="pdf-card"><p><strong>第'+p.page+'页</strong></p>'+imgHtml+'<p>'+(p.text||'')+'</p></div>';
  });
  document.getElementById('pdfGrid').innerHTML=html;
}

function openImg(src){document.getElementById('imgModalImg').src=src;document.getElementById('imgModal').classList.add('active')}
function closeImgModal(){document.getElementById('imgModal').classList.remove('active')}

function handleSearch(){
  var q=document.getElementById('globalSearch').value.trim();
  if(q==="")return;
  document.getElementById('excelSearch').value=q;
  renderExcel();
  document.getElementById('catSearch').value=q;
  renderCatTree();
}

buildDimToolbar();
renderExcel();
renderCatTree();
renderPDF();
</script>
